simulation:
  num_sensors: 8
  sampling_interval_minutes: 1
  duration_days: 30
  start_date: "2026-09-01T00:00:00"
  seed: 42

signals:
  voltage:
    nominal: 230.0        # V
    noise_std: 1.2
  current:
    nominal: 15.0         # A
    noise_std: 0.5
  active_power:
    nominal: 3.45         # kW
    noise_std: 0.2
  power_factor:
    nominal: 0.92
    noise_std: 0.015
  energy_consumption:
    interval_kwh: 0.0575  # ~ 3.45 kW * 1/60 hr

anomaly_injection:
  target_anomaly_ratio: 0.10    # Target anomaly footprint
  types:
    sensor_bias:
      enabled: true
      offset_range: [5.0, 15.0]
      duration_min: [10, 45]
      count: 14
    sensor_drift:
      enabled: true
      rate_per_min: [0.02, 0.08]
      duration_min: [60, 180]
      count: 12
    spike:
      enabled: true
      magnitude_range: [4.0, 12.0]
      duration_min: [1, 3]
      count: 25
    dropout:
      enabled: true
      duration_min: [2, 15]
      count: 15
    constant_freeze:
      enabled: true
      duration_min: [15, 60]
      count: 12
    replay_attack:
      enabled: true
      replay_window_min: [15, 60]
      count: 10
    bias_injection:
      enabled: true
      offset_range: [8.0, 20.0]
      duration_min: [15, 45]
      count: 12
    random_corruption:
      enabled: true
      duration_min: [5, 20]
      count: 14
    grid_event:
      enabled: true
      magnitude_factor: [0.08, 0.22]
      duration_min: [5, 25]
      count: 8
    equipment_fault:
      enabled: true
      duration_min: [20, 90]
      count: 10

split:
  train: 0.70
  val:   0.15
  test:  0.15
  stratify_by: anomaly_type
